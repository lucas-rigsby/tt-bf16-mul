# Tiny Tapeout project information — filled in for the bf16 multiplier.
# Copy over the template's info.yaml (keep yaml_version from the template
# you clone, in case it is newer than this one).
project:
  title:        "bfloat16 multiplier"
  author:       "Lucas Rigsby"
  discord:      ""
  description:  "Round-toward-zero bfloat16 multiplier with byte-serial operand loading"
  language:     "Verilog"
  clock_hz:     25000000

  # ~490 gates incl. 48 flip-flops before mapping (Yosys generic synth):
  # should fit one tile. The GDS Action reports real utilisation.
  tiles: "1x1"

  # Rename to tt_um_<your_github_username>_bf16 (must be unique), here, in
  # src/project.v and in test/tb.v.
  top_module:  "tt_um_lucas_rigsby_bf16"

  source_files:
    - "project.v"
    - "bf16_mul_core.v"

pinout:
  # Inputs
  ui[0]: "D0"
  ui[1]: "D1"
  ui[2]: "D2"
  ui[3]: "D3"
  ui[4]: "D4"
  ui[5]: "D5"
  ui[6]: "D6"
  ui[7]: "D7"

  # Outputs
  uo[0]: "P0 / P8"
  uo[1]: "P1 / P9"
  uo[2]: "P2 / P10"
  uo[3]: "P3 / P11"
  uo[4]: "P4 / P12"
  uo[5]: "P5 / P13"
  uo[6]: "P6 / P14"
  uo[7]: "P7 / P15"

  # Bidirectional pins (all used as inputs)
  uio[0]: "LOAD"
  uio[1]: "SEL"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
